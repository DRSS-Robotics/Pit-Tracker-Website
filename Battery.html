        //change table color

        <script>
        document.querySelectorAll('td').forEach(td => {
        if (parseFloat(td.innerText) < 5) {
            td.classList.add('low');
        }
        else if (parseFloat(td.innerText) > 5){
         td.classList.add('high');
        }
        else{
            td.classList.add('low');
        }
        });
        </script>
        <style>
        .low { background-color: red; }
        .high { background-color: green; }
        </style>
